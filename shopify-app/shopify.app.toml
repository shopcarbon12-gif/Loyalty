# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4727a6133fedbfcf37e9df7fba5744de"
name = "Carbon_Studio"
application_url = "https://app.shopcarbon.com/"
embedded = true

[webhooks]
api_version = "2026-01"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_content,read_customers,read_discounts,read_draft_orders,read_legal_policies,read_locales,read_locations,read_markets,read_metaobject_definitions,read_metaobjects,read_online_store_navigation,read_orders,read_pixels,read_products,read_publications,read_script_tags,read_shipping,read_themes,read_translations,write_content,write_customers,write_discounts,write_draft_orders,write_files,write_inventory,write_legal_policies,write_locales,write_markets,write_online_store_navigation,write_orders,write_pixels,write_products,write_publications,write_script_tags,write_shipping,write_themes,write_translations"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://app.shopcarbon.com/api/shopify/callback",
  "http://localhost:3000/api/shopify/callback",
  "http://localhost:3040/api/shopify/callback",
  "https://ais-dev-ap6lftrkdxdrgcr7vt4pu5-368555571083.us-west2.run.app/auth/callback"
]

# shopcarbon.com/apps/loyalty/* → Carbon Rewards. Signed with the logged-in
# customer; powers the "Use your points" box in the cart (theme snippet
# carbon-rewards-cart).
[app_proxy]
url = "https://rewards.shopcarbon.com/apps/loyalty"
subpath = "loyalty"
prefix = "apps"
